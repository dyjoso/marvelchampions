    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Simple scrollbar styling for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a202c; /* bg-gray-900 */
        }
        ::-webkit-scrollbar-thumb {

    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-4xl">
        
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-red-500 tracking-tight">Marvel Champions</h1>
            <h2 class="text-xl sm:text-2xl font-semibold text-gray-300">Solo Champions League Archive</h2>
            <p class="text-xs text-gray-500 mt-2">This is a fan-made site. All original content and data courtesy of <a href="https://www.bearoverinnsmouth.com/solo-champions-league" target="_blank" rel="noopener noreferrer" class="text-red-400 hover:text-red-500 underline">Innsmouth Bear</a>.</p>
        </header>

        <div class="flex flex-col sm:flex-row gap-4 mb-8">
            <div class="flex-1">

                <select id="season-select" class="bg-gray-800 border border-gray-700 text-white text-sm rounded-lg focus:ring-red-500 focus:border-red-500 block w-full p-2.5 transition duration-150 ease-in-out">
                    </select>
            </div>
            <div class="flex-1">

                    </select>
            </div>
        </div>

        <div id="scenario-details" class="bg-gray-800 border border-gray-700 rounded-lg p-6 min-h-[250px] shadow-lg transition-opacity duration-300 ease-in-out">
            </div>

			            { name: "Round 5", scenario: "Red Skull + Galactic Artifacts + Children of Thanos + Ship Command", difficulty: "Expert", hero: "Captain America", aspect: "Aggression, Justice, Leadership, Protection, or All Basic", campaignElements: "GMW Marketplace Units - Refer to \"Available Units\" on Season Leaderboard. If this is your first Round of the Season, then 13 Units. TRoRS - 1X Condition Upgrade [Improved] if you add Martial Law and Zola's Algorithm to player deck." }
                    ]
                },
                17: {
                    rules: "Season 17: All-Stars (Oops! All Goblins) will operate with standard Solo Play Rules.",
                    rounds: [
                        { name: "Round 1", scenario: "The Hood + ???", difficulty: "Standard", hero: "Cyclops, Ghost Spider, Rogue, SP//dr, Spectrum, or War Machine", aspect: "Aggression", note: "Modular Sets: 1 - City in Chaos, 2 - A Mess of Things, 3 - Sinister Assault, 4 - Power Drain, 5 - Running Interference, 6 - Fantasy, 7 - Sinister Syndicate. For your first official attempt, start with Modular set #1 (City in Chaos) in the Encounter Deck. When asked to add a modular set to your Encounter Deck, add the next Modular set on the list, in order. For your second attempt, start with Modular Set #3 (Sinister Assault) and for your third, start with Modular Set #5 (Running Interference). In each attempt, move down the list, circling back to #1 if needed." },
                        { name: "Round 2", scenario: "Risky Business + Deathstrike", difficulty: "Standard", hero: "Wolverine", aspect: "Aggression, Justice, Leadership, 'Pool, Protection, or All Basic" },
                        { name: "Round 3", scenario: "Spiral + Goblin Gimmicks + Crime + Fantasy + Horror", difficulty: "Standard", hero: "Black Widow, Captain America, Colossus, Doctor Strange, Rocket Raccoon, or Spider-Man [Miles Morales]", aspect: "Leadership", note: "Show Deck: Each attempt starts with a different environment in play." },
                        { name: "Round 4", scenario: "Mutagen Formula + Shadow King", difficulty: "Expert", hero: "Storm", aspect: "Aggression, Justice, Leadership, 'Pool, Protection, or All Basic" },
                        { name: "Round 5", scenario: "Venom Goblin + Longshot + Symbiotic Strength", difficulty: "Expert", hero: "Ironheart, Nova, Phoenix, Shadowcat, Spider-Ham, or Venom", aspect: "Justice" }
                    ]
                },
                18: {
                    rules: "Season 18: Least Used will operate with standard Solo Play Rules.",
                    rounds: [
                        { name: "Round 1", scenario: "Sabretooth + Brothers Grimm + Mystique", difficulty: "Standard", hero: "Phoenix", aspect: "Aggression, Justice, Leadership, Protection, 'Pool, or All Basic", roundChallenge: "Least damage to Robert Kelly at end of game." },
                        { name: "Round 2", scenario: "Project Wideawake + Guerrilla Tactics + Zero Tolerance", difficulty: "Standard", hero: "Colossus, Cyclops, Gamora, Ironheart, SP//dr, or War Machine", aspect: "Protection or 'Pool", roundChallenge: "Most Sentinel enemies in play at end of game." },
                        { name: "Round 3", scenario: "Magneto + Sinister Syndicate", difficulty: "Standard", hero: "Spider-Ham", aspect: "Aggression, Justice, Leadership, Protection, 'Pool, or All Basic", roundChallenge: "Use Valkyrie instead of Spider-Ham as your Hero." },
                        { name: "Round 4", scenario: "Venom + Crossfire's Crew + Symbiotic Strength", difficulty: "Expert", hero: "Drax, Gambit, Shadowcat, Star-Lord, Storm or Vision", aspect: "Basic or 'Pool", roundChallenge: "Bell Tower on Quiet side at end of game." },
                        { name: "Round 5", scenario: "Mansion Attack + Reavers + Brotherhood", difficulty: "Expert", hero: "Rogue", aspect: "Aggression, Justice, Leadership, Protection, 'Pool, or All Basic", roundChallenge: "Most Traits on Rogue at end of game." }
                    ]
                },
                19: {
                    rules: "Season 19: Long Time, No See will operate with standard Solo Play Rules.",
                    rounds: [
                        { name: "Round 1", scenario: "Crossbones + Down to Earth + Experimental Weapons + Weapon Master + Legions of Hydra", difficulty: "Standard", hero: "Ant-Man, Captain Marvel, Hulk, Iron Man, Scarlet Witch, or Wasp", aspect: "Leadership", roundChallenge: "Start with \"Exo-Suit\" in play." },
                        { name: "Round 2", scenario: "Infiltrate the Museum + Black Order + Galactic Artifacts", difficulty: "Standard", hero: "She-Hulk", aspect: "Aggression, Justice, Leadership, Protection, 'Pool, or All Basic", roundChallenge: "Least number of cards in The Collection." },
                        { name: "Round 3", scenario: "Zola + Whispers of Paranoia", difficulty: "Standard", hero: "Black Panther, Hawkeye, Ms. Marvel, Quicksilver, Spider-Woman, or Thor", aspect: "Protection", roundChallenge: "Most Upgrades in play at end of game." },
                        { name: "Round 4", scenario: "Rhino + Sci-Fi", difficulty: "Expert", hero: "Spider-Man [Peter Parker]", aspect: "Aggression, Justice, Leadership, Protection, 'Pool, or All Basic", roundChallenge: "Defeat Rhino [Stage II] and Rhino [Stage III] with a Swinging Web Kick." },
                        { name: "Round 5", scenario: "Ultron + Sentinels", difficulty: "Expert", hero: "Adam Warlock, Ghost-Spider, Groot, Nebula, Spectrum, or Wolverine", aspect: "Justice", roundChallenge: "Add \"Infinity Gauntlet\" Modular Set." }
                    ]
                }
            };

            // --- DOM ELEMENTS ---
            const seasonSelect = document.getElementById('season-select');
            const roundSelect = document.getElementById('round-select');
            const scenarioDetailsDiv = document.getElementById('scenario-details');

            // --- FUNCTIONS ---

            /**
             * Populates the season dropdown with options from the scenarioData object.
             */
            function populateSeasons() {
                const seasons = Object.keys(scenarioData);
                seasonSelect.innerHTML = seasons.map(season => `<option value="${season}">Season ${season}</option>`).join('');
            }

            /**
             * Populates the round dropdown based on the selected season.
             */
            function populateRounds() {
                const selectedSeason = seasonSelect.value;
                const rounds = scenarioData[selectedSeason].rounds;
                roundSelect.innerHTML = rounds.map((round, index) => `<option value="${index}">${round.name}</option>`).join('');
            }

            /**
             * Displays the details for the currently selected scenario.
             */
            function displayScenario() {
                const season = scenarioData[seasonSelect.value];
                const round = season.rounds[roundSelect.value];

                let html = `
                    <div class="space-y-4">
                        <div>
                            <p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Scenario</p>
                            <p class="text-lg font-semibold text-red-400">${round.scenario}</p>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Hero</p>
                            <p class="text-lg font-semibold text-gray-200">${round.hero}</p>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Aspect</p>
                            <p class="text-lg font-semibold text-gray-200">${round.aspect}</p>
                        </div>
                `;

                if (round.difficulty) {
                    html += `<div><p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Difficulty</p><p class="text-lg font-semibold text-gray-200">${round.difficulty}</p></div>`;
                }
                if (round.deckBuilding) {
                    html += `<div><p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Deck-Building Constraint</p><p class="text-sm text-gray-300">${round.deckBuilding}</p></div>`;
                }
                 if (round.note) {
                    html += `<div><p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Note</p><p class="text-sm text-gray-300 italic">${round.note}</p></div>`;
                }
                if (round.specialRules) {
                    html += `<div><p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Special Rules</p><p class="text-sm text-gray-300">${round.specialRules}</p></div>`;
                }
                if (round.campaignUpgrades) {
                    html += `<div><p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Campaign Upgrades</p><p class="text-sm text-gray-300">${round.campaignUpgrades}</p></div>`;
                }
                if (round.campaignElements) {
                    html += `<div><p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Campaign Elements</p><p class="text-sm text-gray-300">${round.campaignElements}</p></div>`;
                }
                 if (round.units) {
                    html += `<div><p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Units</p><p class="text-lg font-semibold text-gray-200">${round.units}</p></div>`;
                }
                if (round.roundChallenge) {
                    html += `<div><p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Round Challenge</p><p class="text-sm text-gray-300">${round.roundChallenge}</p></div>`;
                }
                
                html += `
                        <div class="pt-4 mt-4 border-t border-gray-700">
                            <p class="text-sm font-medium text-gray-400 uppercase tracking-wider">Season Rules</p>
                            <p class="text-sm text-gray-300">${season.rules}</p>
                        </div>
                    </div>
                `;

                scenarioDetailsDiv.innerHTML = html;
            }

            // --- EVENT LISTENERS ---
            seasonSelect.addEventListener('change', () => {
                populateRounds();
                displayScenario();
            });

            roundSelect.addEventListener('change', displayScenario);

            // --- INITIALIZATION ---
            populateSeasons();
            populateRounds();
            displayScenario();
        });
    </script>
