<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Modular Sets · CEREBRO</title>
    <meta name="description" content="VillainTheory's modular set suggestions for every Marvel Champions villain, filterable by campaign and difficulty.">
    <meta property="og:title" content="VillainTheory's Best Modular Sets">
    <meta name="theme-color" content="#111827">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <nav id="site-nav"></nav>

    <main class="page max-w-5xl">
        <header class="text-center mb-6 sm:mb-8">
            <h1 class="page-title">VillainTheory's Best Modular Sets</h1>
            <p class="page-intro text-lg">An alternative presentation of VillainTheory's excellent work.</p>
            <p class="text-sm text-gray-400 mt-2">See the original:
                <a href="https://docs.google.com/document/d/1AOED4MPkrEGIOAVzV4VJaFAc4bWHfhstOSVTqhSpvHU/edit" target="_blank" rel="noopener noreferrer" class="text-red-400 hover:text-red-300 underline">Every Villain's Best Modular Sets (Google Doc)</a></p>
        </header>

        <div class="panel p-4 sm:p-6 mb-4 grid gap-4 md:grid-cols-3">
            <div>
                <label for="campaign-select" class="field-label">Campaign</label>
                <select id="campaign-select" class="field"></select>
            </div>
            <div>
                <label for="villain-select" class="field-label">Villain</label>
                <select id="villain-select" class="field"></select>
            </div>
            <div>
                <label for="difficulty-select" class="field-label">Difficulty</label>
                <select id="difficulty-select" class="field"></select>
            </div>
        </div>

        <p id="result-count" class="text-sm text-gray-400 mb-4" aria-live="polite"></p>

        <div id="results-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <div id="no-results" class="text-center py-12 text-gray-500" hidden>
            <p class="text-2xl font-semibold">No scenarios found.</p>
            <p class="text-lg">Please try adjusting your selections.</p>
        </div>
    </main>

    <footer id="site-footer" data-credit="Data based on VillainTheory's &quot;Every Villain's Best Modular Sets&quot; document."></footer>

    <script src="assets/js/site.js"></script>
    <script src="data/modular-sets.js"></script>
    <script>
        const sets = window.MODULAR_SETS;
        const groups = window.MODULAR_GROUPS;
        const esc = MC.escapeHtml;
        const $ = id => document.getElementById(id);
        const campaignSelect = $('campaign-select');
        const villainSelect = $('villain-select');
        const difficultySelect = $('difficulty-select');
        const results = $('results-container');
        const LAST_PICK = 'cerebro.modulars.last';

        const diffNum = d => parseInt(String(d).replace('+', ''), 10) || 0;

        function difficultyColor(d) {
            const n = diffNum(d);
            if (n <= -1) return 'bg-sky-500 text-sky-950';
            if (n <= 0) return 'bg-green-500 text-green-950';
            if (n <= 2) return 'bg-yellow-400 text-yellow-950';
            if (n <= 3) return 'bg-orange-500 text-orange-950';
            return 'bg-red-600 text-red-50';
        }

        const options = (list, toLabel = x => x) =>
            list.map(v => `<option value="${esc(v)}">${esc(toLabel(v))}</option>`).join('');

        function populateVillains() {
            const c = campaignSelect.value;
            const villains = c === 'All' ? Object.values(groups).flat() : (groups[c] || []);
            villainSelect.innerHTML = options(villains);
        }

        function populateDifficulties() {
            const diffs = [...new Set(sets.filter(s => s.villain === villainSelect.value).map(s => s.difficulty))]
                .sort((a, b) => diffNum(a) - diffNum(b));
            difficultySelect.innerHTML = `<option value="All">All Difficulties</option>` + options(diffs, d => `Difficulty: ${d}`);
        }

        function card(s) {
            const isDefault = /^DEFAULT MODULAR/i.test(s.name);
            const title = isDefault ? (/S$/i.test(s.name.trim()) ? 'Default modulars' : 'Default modular') : s.name;
            return `
                <article class="panel p-4 flex flex-col transition duration-200 hover:-translate-y-0.5 hover:border-red-500/60 ${isDefault ? 'ring-1 ring-gray-500' : ''}">
                    <div class="flex justify-between items-start gap-2 mb-3">
                        <h2 class="text-xl font-bold text-white leading-tight">${esc(title)}</h2>
                        <span class="text-base font-bold px-3 py-0.5 rounded-full whitespace-nowrap ${difficultyColor(s.difficulty)}"
                              title="Difficulty relative to the default modular">${esc(s.difficulty)}</span>
                    </div>
                    <div class="flex-grow space-y-3">
                        <div><p class="text-sm text-gray-400">Modular Set(s)</p><p class="text-blue-300 font-semibold">${esc(s.modulars)}</p></div>
                        <div><p class="text-sm text-gray-400">Pack(s)</p><p class="text-green-300">${esc(s.packs)}</p></div>
                        <div><p class="text-sm text-gray-400">Notes</p><p class="text-gray-300">${esc(s.notes || 'No notes available.')}</p></div>
                    </div>
                </article>`;
        }

        function render() {
            const d = difficultySelect.value;
            const list = sets.filter(s => s.villain === villainSelect.value && (d === 'All' || s.difficulty === d));
            results.innerHTML = list.map(card).join('');
            $('no-results').hidden = list.length > 0;
            $('result-count').textContent = list.length ? `${list.length} suggestion${list.length > 1 ? 's' : ''} for ${villainSelect.value}` : '';
            MC.store.set(LAST_PICK, { campaign: campaignSelect.value, villain: villainSelect.value, difficulty: d });
        }

        campaignSelect.innerHTML = `<option value="All">All Campaigns</option>` + options(Object.keys(groups));
        campaignSelect.addEventListener('change', () => { populateVillains(); populateDifficulties(); render(); });
        villainSelect.addEventListener('change', () => { populateDifficulties(); render(); });
        difficultySelect.addEventListener('change', render);

        // Restore the last selection, falling back to the Core Set.
        const last = MC.store.get(LAST_PICK) || {};
        campaignSelect.value = groups[last.campaign] || last.campaign === 'All' ? last.campaign : 'Core Set';
        populateVillains();
        if (last.villain && [...villainSelect.options].some(o => o.value === last.villain)) villainSelect.value = last.villain;
        populateDifficulties();
        if (last.difficulty && [...difficultySelect.options].some(o => o.value === last.difficulty)) difficultySelect.value = last.difficulty;
        render();
    </script>
</body>
</html>
