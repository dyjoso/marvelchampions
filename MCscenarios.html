            { villain: "God of Lies (Loki #2)", name: "Time Variance Authority", modulars: "Temporal", difficulty: "+1", notes: "Small minions. Stuns. Thematic.", packs: "KANG" },
            { villain: "God of Lies (Loki #2)", name: "Magical Treasures", modulars: "Galactic Artifacts", difficulty: "+1", notes: "Victory display side schemes. Attachments. Thematic.", packs: "GMW" },
            { villain: "God of Lies (Loki #2)", name: "Intergalactic Illusion", modulars: "Ship Command, Menagerie Medley", difficulty: "+1", notes: "Treacheries. Anti-Ally. Surprise damage. Mixed minions. Impactful boost abilities. Confuses. Resource generator.", packs: "GMW, GMW" },
            { villain: "God of Lies (Loki #2)", name: "A Little Chaos", modulars: "Streets of Mayhem", difficulty: "+1", notes: "Changing environment. High boost icons.", packs: "HOOD" },
            { villain: "God of Lies (Loki #2)", name: "Illusions of Betrayal", modulars: "Spider-Man, Mighty Avengers", difficulty: "+2", notes: "Medium minions. When Revealed abilities.. Impactful boost abilities. Thematic.", packs: "CW" },
            { villain: "God of Lies (Loki #2)", name: "Loki Laufeyson", modulars: "Frost Giants", difficulty: "+2", notes: "Sends alterego-. Large minions. Thematic.", packs: "MTS" },
            { villain: "God of Lies (Loki #2)", name: "Trickster", modulars: "Thor's Nemesis Set", difficulty: "+2", notes: "Large minions. Thematic.", packs: "THOR" },
            { villain: "God of Lies (Loki #2)", name: "Beguiling Magic", modulars: "Enchantress", difficulty: "+2", notes: "Anti-Rush. Sends alter-ego. Steals allies. Thematic.", packs: "MTS" },
            { villain: "God of Lies (Loki #2)", name: "'We Are Mystic!'", modulars: "Symbiotic Strength", difficulty: "+3", notes: "Extra attacks. Dangerous attacks. Small minions. Treacheries.", packs: "SM" },
            { villain: "God of Lies (Loki #2)", name: "One Does Not Simply", modulars: "Sauron", difficulty: "+3", notes: "Treacheries. Large minion.", packs: "ICEMAN" },
            { villain: "God of Lies (Loki #2)", name: "Twisted Illusions", modulars: "Personal Nightmare, Whispers of Paranoia", difficulty: "+3", notes: "Sends alter-ego. Nemesis interaction. Huge side scheme. Discards. 2x Medium minions. Thematic.", packs: "SM, SM" },
            { villain: "God of Lies (Loki #2)", name: "Not a Frost Giant", modulars: "Growing Strong", difficulty: "+4", notes: "Boss minion. Treacheries.", packs: "SILK" },
            { villain: "God of Lies (Loki #2)", name: "Mad Titan's Loki", modulars: "Infinity Gauntlet, Frost Giants", difficulty: "+4", notes: "Status cards. ATK/SCH bonus. Sends alter-ego. Large minions. Thematic.", packs: "MTS, MTS" },

        ];

        document.addEventListener('DOMContentLoaded', () => {
            const campaignSelect = document.getElementById('campaign-select');
            const villainSelect = document.getElementById('villain-select');
            const difficultySelect = document.getElementById('difficulty-select');
            const resultsContainer = document.getElementById('results-container');
            const noResults = document.getElementById('no-results');

            // Data structure for campaigns and their villains
            const campaignData = {
                "Core Set": ["Rhino", "Klaw", "Ultron"],
                "Green Goblin": ["Risky Business", "Mutagen Formula"],
                "The Rise of Red Skull": ["Crossbones", "Absorbing Man", "Taskmaster", "Zola", "Red Skull"],
                "Galaxy's Most Wanted": ["Brotherhood of Badoon (Drang)", "Infiltrate the Museum (Collector #1)", "Escape the Museum (Collector #2)", "Nebula", "Ronan the Accuser"],
                "The Mad Titan's Shadow": ["Ebony Maw", "Tower Defense (Proxima/Corvus)", "Thanos", "Hela", "Loki"],
                "Sinister Motives": ["Sandman", "Venom", "Mysterio", "The Sinister Six", "Venom Goblin"],
                "Mutant Genesis": ["Sabretooth", "Project Wideawake (Sentinels)", "Master Mold", "Mansion Attack", "Magneto"],
                "Next Evolution": ["Morlock Siege", "On the Run", "Juggernaut", "Mister Sinister", "Stryfe"],
                "Age of Apocalypse": ["Unus", "Four Horsemen", "Apocalypse", "Dark Beast", "En Sabah Nur (Apocalypse #2)"],
                "Agents of SHIELD": ["Black Widow", "Batroc", "M.O.D.O.K.", "Thunderbolts", "Baron Zemo"],
                "Trickster Takeover": ["Enchantress", "God of Lies (Loki #2)"]
            };

            function populateCampaigns() {
                const allOption = document.createElement('option');
                allOption.value = "All";
                allOption.textContent = "All Campaigns";
                campaignSelect.appendChild(allOption);

                Object.keys(campaignData).forEach(campaign => {
                    const option = document.createElement('option');
                    option.value = campaign;
                    option.textContent = campaign;
                    campaignSelect.appendChild(option);
                });
            }

            function populateVillains() {
                const selectedCampaign = campaignSelect.value;
                villainSelect.innerHTML = ''; // Clear previous options

                let villains;
                if (selectedCampaign === "All") {
                    villains = Object.values(campaignData).flat();
                } else {
                    villains = campaignData[selectedCampaign] || [];
                }

                villains.forEach(villain => {
                    const option = document.createElement('option');
                    option.value = villain;
                    option.textContent = villain;
                    villainSelect.appendChild(option);
                });

                updateDifficultyOptions();
                renderResults();
            }

            function updateDifficultyOptions() {
                const selectedVillain = villainSelect.value;
                difficultySelect.innerHTML = ''; // Clear previous options

                if (!selectedVillain) return;

                const allOption = document.createElement('option');
                allOption.value = "All";
                allOption.textContent = "All Difficulties";
                difficultySelect.appendChild(allOption);

                const availableDifficulties = [...new Set(
                    scenarioData
                        .filter(s => s.villain === selectedVillain)
                        .map(s => s.difficulty)
                )];
                
                availableDifficulties.sort((a, b) => {
                    const numA = parseInt(a.replace('+', ''), 10);
                    const numB = parseInt(b.replace('+', ''), 10);
                    return numA - numB;
                });

                availableDifficulties.forEach(difficulty => {
                    const option = document.createElement('option');
                    option.value = difficulty;
                    option.textContent = `Difficulty: ${difficulty}`;
                    difficultySelect.appendChild(option);
                });
                
                difficultySelect.value = "All";
            }
            
            // --- NEW: Function to determine difficulty color ---
            function getDifficultyColor(difficulty) {
                const num = parseInt(difficulty.replace('+', ''), 10);
                if (num <= -1) return 'bg-sky-500 text-sky-950'; // Easy
                if (num <= 0) return 'bg-green-500 text-green-950'; // Standard
                if (num <= 2) return 'bg-yellow-400 text-yellow-950'; // Challenging
                if (num <= 3) return 'bg-orange-500 text-orange-950'; // Hard
                return 'bg-red-600 text-red-100'; // Expert+
            }

            function renderResults() {
                const selectedVillain = villainSelect.value;
                const selectedDifficulty = difficultySelect.value;
                
                let filteredScenarios = scenarioData.filter(scenario => scenario.villain === selectedVillain);

                if (selectedDifficulty !== "All") {
                    filteredScenarios = filteredScenarios.filter(scenario => scenario.difficulty === selectedDifficulty);
                }

                resultsContainer.innerHTML = ''; 

                if (filteredScenarios.length === 0) {
                    noResults.classList.remove('hidden');
                } else {
                    noResults.classList.add('hidden');
                    filteredScenarios.forEach(scenario => {
                        const card = document.createElement('div');
                        // --- UPDATED CARD STYLES ---
                        card.className = 'card rounded-lg shadow-lg p-4 flex flex-col transform hover:scale-105 hover:shadow-red-500/20 transition-all duration-300';
                        
                        // --- UPDATED INNER HTML FOR CARD ---
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-3">
                                <h3 class="text-xl font-bold text-white pr-2 leading-tight">${scenario.name}</h3>
                                <span class="text-lg font-bold px-3 py-1 rounded-full whitespace-nowrap ${getDifficultyColor(scenario.difficulty)}">${scenario.difficulty}</span>
                            </div>

                            <div class="flex-grow space-y-3">
                                <div>
                                    <p class="text-sm font-medium text-gray-400 leading-tight">Modular Set(s):</p>
                                    <p class="text-base text-blue-300 font-semibold leading-snug">${scenario.modulars.split(',').join(', ')}</p>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-gray-400 leading-tight">Pack(s):</p>
                                    <p class="text-base text-green-300 leading-snug">${scenario.packs.split(',').join(', ')}</p>
                                </div>
                                <div>
                                    <p class="text-sm font-medium text-gray-400 leading-tight">Notes:</p>
                                    <p class="text-base text-gray-300 leading-snug">${scenario.notes || 'No notes available.'}</p>
                                </div>
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });
                }
            }

            // Event Listeners
            campaignSelect.addEventListener('change', populateVillains);
            villainSelect.addEventListener('change', () => {
                updateDifficultyOptions();
                renderResults();
            });
            difficultySelect.addEventListener('change', renderResults);

            // Initial Page Load
            populateCampaigns();
            campaignSelect.value = "Core Set";
            populateVillains();
        });
    </script>
</body>
</html>
