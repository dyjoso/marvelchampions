<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCL Archive · CEREBRO</title>
    <meta name="description" content="Every Solo Champions League season and round for Marvel Champions: scenario, hero, aspect and special rules.">
    <meta property="og:title" content="Marvel Champions SCL Archive">
    <meta name="theme-color" content="#111827">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <nav id="site-nav"></nav>

    <main class="page max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="page-title">Solo Champions League Archive</h1>
            <p class="text-xs text-gray-500 mt-2">All original content and data courtesy of
                <a href="https://www.bearoverinnsmouth.com/solo-champions-league" target="_blank" rel="noopener noreferrer" class="text-red-400 hover:text-red-300 underline">Innsmouth Bear</a>.</p>
        </header>

        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <div class="flex-1">
                <label for="season-select" class="field-label">Season</label>
                <select id="season-select" class="field"></select>
            </div>
            <div class="flex-1">
                <label for="round-select" class="field-label">Round</label>
                <select id="round-select" class="field"></select>
            </div>
        </div>

        <section id="scenario-details" class="panel p-6 min-h-[250px]" aria-live="polite"></section>

        <div class="mt-4 flex justify-end">
            <button id="copy-link" type="button" class="btn-ghost">Copy link to this round</button>
        </div>
    </main>

    <footer id="site-footer" data-credit="Solo Champions League created by Innsmouth Bear."></footer>

    <script src="assets/js/site.js"></script>
    <script src="data/scl-seasons.js"></script>
    <script>
        const seasons = window.SCL_SEASONS;
        const seasonSelect = document.getElementById('season-select');
        const roundSelect = document.getElementById('round-select');
        const details = document.getElementById('scenario-details');
        const copyBtn = document.getElementById('copy-link');
        const esc = MC.escapeHtml;

        // Extra fields shown below the main three, in this order.
        const EXTRA_FIELDS = [
            ['difficulty', 'Difficulty', 'big'],
            ['deckBuilding', 'Deck-Building Constraint'],
            ['note', 'Note', 'italic'],
            ['specialRules', 'Special Rules'],
            ['campaignUpgrades', 'Campaign Upgrades'],
            ['campaignElements', 'Campaign Elements'],
            ['units', 'Units', 'big'],
            ['upgrade', 'Upgrade'],
            ['roundChallenge', 'Round Challenge'],
        ];

        // "Season 12: People's Choice will operate..." -> "Season 12: People's Choice"
        function seasonLabel(num) {
            const m = seasons[num].rules.match(/^(Season \d+: .+?) will operate/);
            return m ? m[1] : `Season ${num}`;
        }

        function populateSeasons() {
            const nums = Object.keys(seasons).sort((a, b) => b - a); // newest first
            seasonSelect.innerHTML = nums.map(n => `<option value="${n}">${esc(seasonLabel(n))}</option>`).join('');
        }

        function populateRounds() {
            const rounds = seasons[seasonSelect.value].rounds;
            roundSelect.innerHTML = rounds.map((r, i) => `<option value="${i}">${esc(r.name)}</option>`).join('');
        }

        function field(label, value, style) {
            const cls = style === 'big' ? 'text-lg font-semibold text-gray-200'
                : style === 'italic' ? 'text-sm text-gray-300 italic' : 'text-sm text-gray-300';
            return `<div><p class="eyebrow">${label}</p><p class="${cls} mt-0.5">${esc(value)}</p></div>`;
        }

        function displayScenario() {
            const season = seasons[seasonSelect.value];
            const round = season.rounds[roundSelect.value];
            let html = `
                <div class="space-y-4">
                    <div><p class="eyebrow">Scenario</p><p class="text-lg font-semibold text-red-400 mt-0.5">${esc(round.scenario)}</p></div>
                    ${field('Hero', round.hero, 'big')}
                    ${field('Aspect', round.aspect, 'big')}`;
            EXTRA_FIELDS.forEach(([key, label, style]) => {
                if (round[key]) html += field(label, round[key], style);
            });
            html += `
                    <div class="pt-4 mt-4 border-t border-gray-700">${field('Season Rules', season.rules)}</div>
                </div>`;
            details.innerHTML = html;
            history.replaceState(null, '', `#s${seasonSelect.value}r${Number(roundSelect.value) + 1}`);
        }

        // Reads links like #s19r3 (season 19, round 3).
        function applyHash() {
            const m = location.hash.match(/^#s(\d+)(?:r(\d+))?$/);
            if (!m || !seasons[m[1]]) return false;
            seasonSelect.value = m[1];
            populateRounds();
            const idx = (Number(m[2]) || 1) - 1;
            if (seasons[m[1]].rounds[idx]) roundSelect.value = idx;
            return true;
        }

        seasonSelect.addEventListener('change', () => { populateRounds(); displayScenario(); });
        roundSelect.addEventListener('change', displayScenario);
        window.addEventListener('hashchange', () => { if (applyHash()) displayScenario(); });

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(location.href);
                copyBtn.textContent = 'Link copied!';
            } catch {
                copyBtn.textContent = 'Copy failed: use the address bar';
            }
            setTimeout(() => { copyBtn.textContent = 'Copy link to this round'; }, 2000);
        });

        populateSeasons();
        if (!applyHash()) populateRounds();
        displayScenario();
    </script>
</body>
</html>
