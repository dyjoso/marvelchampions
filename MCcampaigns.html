<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-white antialiased">
    <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-4xl min-h-screen flex flex-col items-center">
        
        <!-- Header -->
        <header class="w-full text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-red-500 tracking-tight">Marvel Champions Campaign Guide</h1>
            <p class="text-gray-400 mt-2">Campaign scenario setup and victory instructions. Campaign Log saves notes for each campaign.</p>
        </header>

        <!-- Controls -->
        <div class="w-full flex flex-col sm:flex-row gap-4 mb-8">
            <div class="flex-1">
                <label for="campaign-select" class="block mb-2 text-sm font-medium text-gray-300">Campaign</label>
                <select id="campaign-select" class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5">
                    <!-- Options populated by JavaScript -->
                </select>
            </div>
            <div class="flex-1">
                <label for="scenario-select" class="block mb-2 text-sm font-medium text-gray-300">Scenario</label>
                <select id="scenario-select" class="bg-gray-800 border border-gray-600 text-white text-sm rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-2.5" disabled>
                    <option selected disabled>Select a campaign first</option>
                </select>
            </div>
        </div>

        <!-- Scenario Info Display -->
        <div id="scenario-info" class="w-full bg-gray-800/50 rounded-lg p-6 border border-gray-700 backdrop-blur-sm transition-opacity duration-500 opacity-0 hidden">
            <h2 id="scenario-title" class="text-2xl font-bold text-cyan-300 border-b border-gray-600 pb-3 mb-4"></h2>
            
            <div class="space-y-6">
                <div>
                    <h3 class="text-lg font-semibold text-gray-300 mb-2">Additional Modules Required</h3>
                    <p id="modules-info" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
                
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-gray-800 p-4 rounded-md border border-gray-700">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-2">Setup</h3>
                        <div id="setup-info" class="text-gray-300 text-sm"></div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-md border border-gray-700">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-2">Victory</h3>
                        <div id="victory-info" class="text-gray-300 text-sm"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Campaign Specific Info -->
        <div id="campaign-specific-info" class="w-full mt-8 hidden">
            <!-- Content will be injected by JavaScript -->
        </div>

        <!-- Campaign Log -->
        <div id="campaign-log-container" class="w-full mt-8 hidden">
            <div class="bg-gray-800/50 rounded-lg p-6 border border-gray-700 backdrop-blur-sm">
                <h2 class="text-2xl font-bold text-teal-300 border-b border-gray-600 pb-3 mb-4">Campaign Log</h2>
                <textarea id="campaign-log" class="bg-gray-900 border border-gray-600 text-white text-sm rounded-lg focus:ring-teal-500 focus:border-teal-500 block w-full p-2.5 h-48" placeholder="Enter campaign notes here..."></textarea>
                <div class="flex justify-end mt-4 gap-3">
                    <button id="save-log" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Save Log</button>
                    <button id="clear-log" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Clear Log</button>
                </div>
                 <p id="save-confirm" class="text-xs text-gray-400 mt-2 text-right opacity-0 transition-opacity duration-300">Log saved!</p>
            </div>
        </div>

        const campaignSelect = document.getElementById('campaign-select');
        const scenarioSelect = document.getElementById('scenario-select');
        const scenarioInfo = document.getElementById('scenario-info');
        const placeholder = document.getElementById('placeholder');
        const campaignSpecificInfoContainer = document.getElementById('campaign-specific-info');
        const campaignLogContainer = document.getElementById('campaign-log-container');
        const campaignLog = document.getElementById('campaign-log');
        const saveLogBtn = document.getElementById('save-log');
        const clearLogBtn = document.getElementById('clear-log');
        const saveConfirm = document.getElementById('save-confirm');
        
        const scenarioTitle = document.getElementById('scenario-title');
        const modulesInfo = document.getElementById('modules-info');
        const setupInfo = document.getElementById('setup-info');
        const victoryInfo = document.getElementById('victory-info');

        // Function to format text with paragraph spacing and expert highlighting
        function formatText(text) {
            if (!text) return '';
            return text.split('\n')
                .filter(line => line.trim() !== '') // Remove empty lines from data
                .map(line => {
                    const trimmedLine = line.trim();
                    // Check for "Expert Campaign" prefix, case-insensitive
                    if (trimmedLine.match(/^(>>\s*)?Expert Campaign/i)) {
                        // Remove the prefix for cleaner display inside the box
                        const content = trimmedLine.replace(/^(>>\s*)?Expert Campaign:?\s*/i, '');
                        return `<div class="bg-cyan-900/50 p-3 rounded-md border border-cyan-800 mb-3 text-sm">
                                    <strong class="font-semibold text-cyan-300 block mb-1">Expert Campaign</strong>
                                    <p class="text-gray-300 leading-relaxed">${content}</p>
                                </div>`;
                    } else {
                        return `<p class="mb-3 leading-relaxed">${trimmedLine.replace(/^>>\s*/, '')}</p>`;
                    }
                })
                .join('');
        }

        // Function to load log from localStorage
        function loadLog(campaignName) {
            const savedLog = localStorage.getItem(`campaignLog_${campaignName}`);
            campaignLog.value = savedLog || '';
        }

        // Function to save log to localStorage
        function saveLog(campaignName) {
            localStorage.setItem(`campaignLog_${campaignName}`, campaignLog.value);
            saveConfirm.classList.remove('opacity-0');
            setTimeout(() => {
                saveConfirm.classList.add('opacity-0');
            }, 2000);
        }

        // Function to clear log from localStorage
        function clearLog(campaignName) {
            localStorage.removeItem(`campaignLog_${campaignName}`);
            campaignLog.value = '';
        }

        // Populate campaign dropdown on load and select the first campaign/scenario
        document.addEventListener('DOMContentLoaded', () => {
            const campaigns = Object.keys(campaignData);
            if (campaigns.length > 0) {
                campaigns.forEach(campaign => {
                    const option = document.createElement('option');
                    option.value = campaign;
                    option.textContent = campaign;
                    campaignSelect.appendChild(option);
                });
                // Select the first campaign and trigger the change event to load its scenarios
                campaignSelect.value = campaigns[0];
                campaignSelect.dispatchEvent(new Event('change'));
            }
        });

        // Event listener for campaign selection
        campaignSelect.addEventListener('change', (e) => {
            const selectedCampaign = e.target.value;
            const campaign = campaignData[selectedCampaign];
            const scenarios = campaign.scenarios;

            // Reset and populate scenario dropdown
            scenarioSelect.innerHTML = ''; // Clear previous scenarios
            scenarios.forEach((scenario, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = scenario.name;
                scenarioSelect.appendChild(option);
            });
            scenarioSelect.disabled = false;

            // Handle campaign-specific info
            if (campaign.campaignInfo) {
                campaignSpecificInfoContainer.innerHTML = campaign.campaignInfo;
                campaignSpecificInfoContainer.classList.remove('hidden');
            } else {
                campaignSpecificInfoContainer.innerHTML = '';
                campaignSpecificInfoContainer.classList.add('hidden');
            }
            
            // Show log and load data
            campaignLogContainer.classList.remove('hidden');
            loadLog(selectedCampaign);

            // Default to the first scenario and trigger the change event to display it
            if (scenarios.length > 0) {
                scenarioSelect.value = 0;
                scenarioSelect.dispatchEvent(new Event('change'));
            }
        });

        // Event listener for scenario selection
        scenarioSelect.addEventListener('change', (e) => {
            const selectedCampaign = campaignSelect.value;
            const selectedScenarioIndex = e.target.value;
            const scenario = campaignData[selectedCampaign].scenarios[selectedScenarioIndex];

            // Populate the info display
            scenarioTitle.textContent = scenario.name;
            modulesInfo.textContent = scenario.modules;
            setupInfo.innerHTML = formatText(scenario.setup);
            victoryInfo.innerHTML = formatText(scenario.victory);

            // Show the info display
            placeholder.classList.add('hidden');
            scenarioInfo.classList.remove('hidden');
            setTimeout(() => scenarioInfo.classList.remove('opacity-0'), 10); // for fade-in effect
        });

        // Event listeners for log buttons
        saveLogBtn.addEventListener('click', () => {
            const selectedCampaign = campaignSelect.value;
            if (selectedCampaign) {
                saveLog(selectedCampaign);
            }
        });

        clearLogBtn.addEventListener('click', () => {
             const selectedCampaign = campaignSelect.value;
            if (selectedCampaign) {
                if (confirm('Are you sure you want to clear the log for this campaign? This cannot be undone.')) {
                    clearLog(selectedCampaign);
                }
            }
        });
    </script>
