<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Guide · CEREBRO</title>
    <meta name="description" content="Setup and victory instructions for every Marvel Champions campaign scenario, with a campaign log saved in your browser.">
    <meta property="og:title" content="Marvel Champions Campaign Guide">
    <meta name="theme-color" content="#111827">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
    <nav id="site-nav"></nav>

    <main class="page max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="page-title">Campaign Guide</h1>
            <p class="page-intro">Campaign scenario setup and victory instructions. The campaign log saves notes for each campaign.</p>
        </header>

        <div class="flex flex-col sm:flex-row gap-4 mb-8">
            <div class="flex-1">
                <label for="campaign-select" class="field-label">Campaign</label>
                <select id="campaign-select" class="field"></select>
            </div>
            <div class="flex-1">
                <label for="scenario-select" class="field-label">Scenario</label>
                <select id="scenario-select" class="field"></select>
            </div>
        </div>

        <section id="scenario-info" class="bg-gray-800/50 rounded-lg p-6 border border-gray-700" aria-live="polite">
            <h2 id="scenario-title" class="text-2xl font-bold text-cyan-300 border-b border-gray-600 pb-3 mb-4"></h2>
            <div class="space-y-6">
                <div>
                    <h3 class="text-lg font-semibold text-gray-300 mb-2">Additional Modules Required</h3>
                    <p id="modules-info" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-gray-800 p-4 rounded-md border border-gray-700">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-2">Setup</h3>
                        <div id="setup-info" class="text-gray-300 text-sm"></div>
                    </div>
                    <div class="bg-gray-800 p-4 rounded-md border border-gray-700">
                        <h3 class="text-lg font-semibold text-cyan-400 mb-2">Victory</h3>
                        <div id="victory-info" class="text-gray-300 text-sm"></div>
                    </div>
                </div>
            </div>
        </section>

        <div id="campaign-specific-info" class="mt-8" hidden></div>

        <section class="mt-8 bg-gray-800/50 rounded-lg p-6 border border-gray-700">
            <div class="flex flex-wrap items-baseline justify-between gap-2 border-b border-gray-600 pb-3 mb-4">
                <h2 class="text-2xl font-bold text-teal-300">Campaign Log</h2>
                <p id="save-status" class="text-xs text-gray-400" role="status"></p>
            </div>
            <label for="campaign-log" class="sr-only">Campaign notes</label>
            <textarea id="campaign-log" class="field bg-gray-900 h-56 resize-y" placeholder="Enter campaign notes here... They save automatically as you type."></textarea>
            <p class="text-xs text-gray-500 mt-2">Notes are stored in this browser only. Use Export to back them up or move them to another device.</p>
            <div class="flex flex-wrap justify-end mt-4 gap-3">
                <button id="export-logs" type="button" class="btn-ghost">Export all logs</button>
                <button id="import-logs" type="button" class="btn-ghost">Import logs</button>
                <input id="import-file" type="file" accept="application/json,.json" class="hidden">
                <button id="clear-log" type="button" class="btn-danger">Clear this log</button>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="assets/js/site.js"></script>
    <script src="data/campaigns.js"></script>
    <script>
        const campaigns = window.CAMPAIGNS;
        const esc = MC.escapeHtml;
        const $ = id => document.getElementById(id);
        const campaignSelect = $('campaign-select');
        const scenarioSelect = $('scenario-select');
        const campaignInfo = $('campaign-specific-info');
        const logBox = $('campaign-log');
        const saveStatus = $('save-status');

        const LOG_PREFIX = 'campaignLog_';   // same key format as the original site
        const LAST_PICK = 'cerebro.campaigns.last';

        // Splits a block of text into paragraphs; "Expert Campaign:" lines get a highlighted box.
        function formatText(text) {
            if (!text) return '';
            return text.split('\n')
                .map(line => line.trim())
                .filter(Boolean)
                .map(line => {
                    if (/^Expert Campaign/i.test(line)) {
                        const content = line.replace(/^Expert Campaign:?\s*/i, '');
                        return `<div class="bg-cyan-900/50 p-3 rounded-md border border-cyan-800 mb-3">
                                    <strong class="font-semibold text-cyan-300 block mb-1">Expert Campaign</strong>
                                    <p class="text-gray-300 leading-relaxed">${esc(content)}</p>
                                </div>`;
                    }
                    return `<p class="mb-3 leading-relaxed">${esc(line)}</p>`;
                })
                .join('');
        }

        // --- Campaign log (autosaves) ---
        let saveTimer;
        let logCampaign = null; // the campaign whose notes are in the text box right now
        function setStatus(text) { saveStatus.textContent = text; }

        function loadLog() {
            logCampaign = campaignSelect.value;
            logBox.value = MC.store.getRaw(LOG_PREFIX + logCampaign) || '';
            setStatus(logBox.value ? 'Saved' : '');
        }

        function saveLogNow() {
            clearTimeout(saveTimer);
            if (!logCampaign) return;
            const key = LOG_PREFIX + logCampaign;
            const ok = logBox.value ? MC.store.setRaw(key, logBox.value) : (MC.store.remove(key), true);
            setStatus(ok ? 'Saved' : 'Could not save: browser storage is blocked');
        }

        logBox.addEventListener('input', () => {
            setStatus('Saving…');
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveLogNow, 600);
        });
        logBox.addEventListener('blur', saveLogNow);
        window.addEventListener('beforeunload', saveLogNow);

        $('clear-log').addEventListener('click', () => {
            if (!confirm(`Clear the log for ${campaignSelect.value}? This cannot be undone.`)) return;
            logBox.value = '';
            saveLogNow();
            setStatus('Cleared');
        });

        $('export-logs').addEventListener('click', () => {
            saveLogNow();
            const logs = {};
            Object.keys(campaigns).forEach(name => {
                const text = MC.store.getRaw(LOG_PREFIX + name);
                if (text) logs[name] = text;
            });
            const blob = new Blob([JSON.stringify({ app: 'CEREBRO', version: 1, exported: new Date().toISOString(), logs }, null, 2)],
                { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `cerebro-campaign-logs-${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        });

        $('import-logs').addEventListener('click', () => $('import-file').click());
        $('import-file').addEventListener('change', async e => {
            const file = e.target.files[0];
            e.target.value = '';
            if (!file) return;
            try {
                const { logs } = JSON.parse(await file.text());
                const names = Object.keys(logs || {}).filter(n => typeof logs[n] === 'string');
                if (!names.length) throw new Error('no logs');
                const clashes = names.filter(n => MC.store.getRaw(LOG_PREFIX + n));
                if (clashes.length && !confirm(`This will replace your current log for: ${clashes.join(', ')}. Continue?`)) return;
                names.forEach(n => MC.store.setRaw(LOG_PREFIX + n, logs[n]));
                loadLog();
                setStatus(`Imported ${names.length} log${names.length > 1 ? 's' : ''}`);
            } catch {
                alert('That file could not be read. Choose a file made with "Export all logs".');
            }
        });

        // --- Campaign and scenario display ---
        function showScenario() {
            const scenario = campaigns[campaignSelect.value].scenarios[scenarioSelect.value];
            $('scenario-title').textContent = scenario.name;
            $('modules-info').textContent = scenario.modules;
            $('setup-info').innerHTML = formatText(scenario.setup);
            $('victory-info').innerHTML = formatText(scenario.victory);
            MC.store.set(LAST_PICK, { campaign: campaignSelect.value, scenario: Number(scenarioSelect.value) });
        }

        function showCampaign(scenarioIndex = 0) {
            const campaign = campaigns[campaignSelect.value];
            scenarioSelect.innerHTML = campaign.scenarios
                .map((s, i) => `<option value="${i}">${esc(s.name)}</option>`).join('');
            scenarioSelect.value = campaign.scenarios[scenarioIndex] ? scenarioIndex : 0;

            // campaignInfo is trusted HTML from data/campaigns.js
            campaignInfo.innerHTML = campaign.campaignInfo || '';
            campaignInfo.hidden = !campaign.campaignInfo;

            loadLog();
            showScenario();
        }

        campaignSelect.innerHTML = Object.keys(campaigns)
            .map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('');

        campaignSelect.addEventListener('change', () => { saveLogNow(); showCampaign(); });
        scenarioSelect.addEventListener('change', showScenario);

        const last = MC.store.get(LAST_PICK);
        if (last && campaigns[last.campaign]) campaignSelect.value = last.campaign;
        showCampaign(last && campaigns[last.campaign] ? last.scenario : 0);
    </script>
</body>
</html>
